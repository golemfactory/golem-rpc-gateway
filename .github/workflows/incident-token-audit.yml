name: Independent read-only GitHub token audit

on:
  workflow_dispatch:

permissions: {}

jobs:
  check:
    if: github.actor == 'prekucki' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Independent GitHub API identity checks and encrypted report
        shell: python
        env:
          TOKEN_TARGETS: '[{"ticket": "GF-019", "source": "golemfactory/golem-rpc-gateway", "secret": "BATCHRPCGITHUBTOKEN", "execution_repository": "golemfactory/golem-rpc-gateway", "env": "S_TOKEN_0"}]'
          RECIPIENT_PUBLIC_KEY: |
            -----BEGIN PGP PUBLIC KEY BLOCK-----
            
            mDMEabVMBhYJKwYBBAHaRw8BAQdAgNyP72YIPei5lx0Yx18JyZg0hQihgpNLxKFC
            MoUbhZq0KFByemVteXPFgmF3IEsuIFJla3Vja2kgPHByZWt1Y2tpQHJjbC5wbD6I
            jgQTFgoANhYhBAypyQBWvQEVWkRhwulqQfSt3vsZBQJptUwGAhsBBAsJCAcEFQoJ
            CAUWAgMBAAIeBQIXgAAKCRDpakH0rd77GYUoAQClNUfI9SjJLrX9Afz8s9Tn3j5m
            R+l4F4kwNzB0OvnN8gD/SYVzhrRMJmkzq+5g1VBO5p/8u6UxTQ9/g9xkh5j5BwG4
            MwRptUzYFgkrBgEEAdpHDwEBB0CjM9B6HeFmN8doNuFALDTM6TeGNLqfhEasRr7Y
            b8SKvoj1BBgWCgAmFiEEDKnJAFa9ARVaRGHC6WpB9K3e+xkFAmm1TNgCGwIFCQHh
            M4AAgQkQ6WpB9K3e+xl2IAQZFgoAHRYhBAykLYQdY6f9k+SX4jcnmKnwzNTfBQJp
            tUzYAAoJEDcnmKnwzNTfUDABAKVV11fUeII7Vhsqvsz0qSERfBjfWeBUa3E6ePD9
            QJnQAQCrWe3HL5q6OBATOG8UvaEhQ2Xu5m8RyHbisn6nEnssDmdlAQDQM9kaX7QR
            luj6iqtkijlQ2mhEV2gboayosOUAijyXswD/XaajRmoYqs+rIz7XVkUX7ADWqMKy
            9/Q/5+HIR86PxAy4MwRptU0jFgkrBgEEAdpHDwEBB0BlX13377375AXDEd0PPf3/
            AUSSQQWWCFIUshLJJADvBIh+BBgWCgAmFiEEDKnJAFa9ARVaRGHC6WpB9K3e+xkF
            Amm1TSMCGyAFCQWjmoAACgkQ6WpB9K3e+xlDqwD+OpWsrKTpPip/5Pz6aBuxVlsP
            hSrozqDDpIcSsBvkQsIA/0Jqe/dAJAeCSzITbMFVJ8XIMHe47fYCwG7SRiVi++UP
            uDgEabfhxxIKKwYBBAGXVQEFAQEHQJml1IqN4q8gUUp8RmdVJFwmx4NkZCPbqPED
            PGMbi74qAwEIB4h+BBgWCgAmFiEEDKnJAFa9ARVaRGHC6WpB9K3e+xkFAmm34ccC
            GwwFCQlmAYAACgkQ6WpB9K3e+xnqNwEA9hbDb4KdtgKnCPqTFRM4BJOUEtBz7tT1
            VZNIafR28vEA/A1OvCGnLrTor+M5k6iJX9lkisCVdoPiZDq+j0Q+X6EL
            =VOH7
            -----END PGP PUBLIC KEY BLOCK-----
          S_TOKEN_0: ${{ secrets.BATCHRPCGITHUBTOKEN }}
        run: |
          import concurrent.futures
          import datetime as dt
          import io
          import json
          import os
          from pathlib import Path
          import re
          import secrets
          import subprocess
          import tarfile
          import tempfile
          import urllib.error
          import urllib.request
          
          FPR='0CA9C90056BD01155A4461C2E96A41F4ADDEFB19'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):return None
          
          def request(path,token):
              assert path.startswith('/') and not path.startswith('//')
              req=urllib.request.Request('https://api.github.com'+path,headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','User-Agent':'independent-incident-token-check','X-GitHub-Api-Version':'2022-11-28'},method='GET')
              try:
                  with urllib.request.build_opener(NoRedirect).open(req,timeout=18) as r:
                      raw=r.read(2*1024*1024+1)
                      if len(raw)>2*1024*1024:return {'status':'INCONCLUSIVE_RESPONSE_TOO_LARGE'},None,{}
                      data=json.loads(raw)
                      headers={k.lower():v for k,v in r.headers.items()}
                      return {'status':'AUTHENTICATED','http_status':r.status},data,headers
              except urllib.error.HTTPError as e:
                  code=e.code
                  if code==401:status='REJECTED'
                  elif code in (403,404):status='DENIED_NOT_PROOF_OF_REVOCATION'
                  elif code==429:status='INCONCLUSIVE_RATE_LIMIT'
                  else:status='INCONCLUSIVE_HTTP_ERROR'
                  return {'status':status,'http_status':code},None,{}
              except (urllib.error.URLError,TimeoutError,OSError):return {'status':'INCONCLUSIVE_TRANSPORT_ERROR'},None,{}
              except (ValueError,UnicodeError):return {'status':'INCONCLUSIVE_RESPONSE_ERROR'},None,{}
          
          def probe(item):
              token=os.environ.get(item['env'],'').strip()
              base={k:item[k] for k in ['ticket','source','secret','execution_repository']}
              base['checked_at']=dt.datetime.now(dt.timezone.utc).isoformat()
              if not token:return {**base,'status':'MISSING_SECRET','meaning':'No token was available in this execution context. This does not prove service-side revocation.'}
              if len(token)>4096 or not re.fullmatch(r'[A-Za-z0-9_.-]+',token):
                  return {**base,'status':'UNSUPPORTED_SECRET_FORMAT','meaning':'Not sent: multiline, structured, private-key or otherwise unsupported credential format.'}
              if token.startswith('ghs_'):kind='GitHub App installation token';endpoint='/installation/repositories?per_page=100'
              elif token.count('.')==2 and token.startswith('eyJ'):kind='JWT-shaped credential';endpoint='/app'
              else:
                  kind='Fine-grained PAT' if token.startswith('github_pat_') else ('Classic PAT' if token.startswith('ghp_') else 'User/OAuth/legacy or unrecognized GitHub access token')
                  endpoint='/user'
              check,data,headers=request(endpoint,token)
              result={**base,**check,'token_kind':kind,'tested_identity_endpoint':endpoint}
              if check['status']!='AUTHENTICATED':return result
              if endpoint=='/user':
                  if not isinstance(data,dict) or not data.get('login'):
                      result['status']='INCONCLUSIVE_RESPONSE_ERROR';return result
                  result['identity']={k:data[k] for k in ['login','id','type'] if k in data}
              elif endpoint=='/app':
                  if not isinstance(data,dict) or not data.get('slug'):
                      result['status']='INCONCLUSIVE_RESPONSE_ERROR';return result
                  result['identity']={k:data[k] for k in ['id','slug','name','permissions'] if k in data}
                  result['meaning']='GitHub App JWT authenticates the app itself; installation/repository access was not minted or tested.'
              else:
                  if not isinstance(data,dict) or not isinstance(data.get('repositories'),list):
                      result['status']='INCONCLUSIVE_RESPONSE_ERROR';return result
                  control,_,_=request(endpoint,'ghs_invalid_negative_control_'+secrets.token_hex(24))
                  result['negative_control']=control
                  if control.get('http_status')!=401:
                      result['status']='INCONCLUSIVE_AUTHENTICATION_CONTROL';return result
                  result['installation_repository_count']=data.get('total_count')
                  result['installation_repository_metadata']=[{k:r[k] for k in ['id','full_name','private','permissions'] if k in r} for r in data['repositories']]
                  result['installation_list_limit']='First 100 repository metadata records only; no content retrieved.'
              result['declared_oauth_scopes']=headers.get('x-oauth-scopes','Not supplied; scope cannot be inferred from absence of this header.')
              result['authentication_token_expiration']=headers.get('github-authentication-token-expiration')
              repo=item['execution_repository']
              assert re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+',repo)
              if endpoint!='/app':
                  access,metadata,_=request('/repos/'+repo,token)
                  result['execution_repository_metadata_check']=access
                  if isinstance(metadata,dict):
                      result['execution_repository_metadata']={k:metadata[k] for k in ['id','full_name','private','permissions'] if k in metadata}
              result['permission_limit']='Only protected identity and repository metadata reads were attempted. Declared OAuth scopes and returned repository-role permissions are metadata, not a live test of content, project, workflow, package or release write permission. Full access to other resources was not enumerated.'
              return result
          
          def safe_probe(item):
              try:return probe(item)
              except Exception as e:
                  return {k:item[k] for k in ['ticket','source','secret','execution_repository']}|{'status':'INCONCLUSIVE_DIAGNOSTIC_ERROR','error_type':type(e).__name__}
          
          def main():
              os.umask(0o077)
              items=json.loads(os.environ['TOKEN_TARGETS'])
              assert 1<=len(items)<=3
              with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:results=list(pool.map(safe_probe,items))
              repo=items[0]['execution_repository']
              report={'repository':repo,'checked_at':dt.datetime.now(dt.timezone.utc).isoformat(),'recipient_fingerprint':FPR,'results':results,'security':'Independently authored code; no checkout, repository code execution, writes, messages, token minting, or credential values in the report. Redirects disabled; only https://api.github.com requested. Denial/404/network failure is not proof of revocation.'}
              markdown='# GitHub token verification\n\nExecution repository: **'+repo+'**.\n\n```json\n'+json.dumps(report,indent=2,ensure_ascii=True)+'\n```\n'
              archive=io.BytesIO()
              with tarfile.open(fileobj=archive,mode='w:gz') as tar:
                  for name,content in [('report.md',markdown.encode()),('report.json',json.dumps(report,indent=2).encode())]:
                      info=tarfile.TarInfo(name);info.mode=0o600;info.size=len(content);tar.addfile(info,io.BytesIO(content))
              clean_env={k:v for k,v in os.environ.items() if not k.startswith('S_TOKEN_')}
              slug=repo.split('/')[1]
              with tempfile.TemporaryDirectory(prefix='github-token-pgp-',dir=os.environ['RUNNER_TEMP']) as home:
                  cmd=['gpg','--homedir',home,'--batch']
                  subprocess.run(cmd+['--import'],input=os.environ['RECIPIENT_PUBLIC_KEY'].encode(),capture_output=True,check=True,env=clean_env)
                  key=subprocess.run(cmd+['--with-colons','--fingerprint',FPR],capture_output=True,text=True,check=True,env=clean_env)
                  assert next(l.split(':')[9] for l in key.stdout.splitlines() if l.startswith('fpr:'))==FPR
                  out=Path(os.environ['RUNNER_TEMP'])/('github-token-'+slug+'.tar.gz.gpg')
                  subprocess.run(cmd+['--yes','--trust-model','always','--recipient',FPR,'--output',str(out),'--encrypt'],input=archive.getvalue(),capture_output=True,check=True,env=clean_env)
              public={'execution_repository':repo,'checked_at':report['checked_at'],'recipient_fingerprint':FPR,'results':[{k:r[k] for k in ['ticket','source','secret','execution_repository','status','http_status'] if k in r} for r in results]}
              (Path(os.environ['RUNNER_TEMP'])/('summary-'+slug+'.json')).write_text(json.dumps(public,indent=2))
              print('Read-only GitHub identity checks complete; detailed results encrypted to pinned owner PGP. No token values printed.')
          
          if __name__=='__main__':main()

      - name: Upload encrypted report and status only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: github-token-golem-rpc-gateway
          path: |
            ${{ runner.temp }}/github-token-golem-rpc-gateway.tar.gz.gpg
            ${{ runner.temp }}/summary-golem-rpc-gateway.json
          if-no-files-found: error
          retention-days: 1
